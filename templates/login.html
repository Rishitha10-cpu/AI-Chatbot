<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page">
        <header class="page-header">
            <div class="chatbot-title">
                <img src="{{ url_for('static', filename='images/robot.png') }}" alt="Robot">
                <div class="chatbot-text">
                    <h1>AI Chatbot</h1>
                    <p>Your intelligent agent</p>
                </div>
            </div>
        </header>
        <main class="login-section">
            <div class="login-image">
                <img src="{{ url_for('static', filename='images/login-image.jpg') }}" alt="AI Chatbot">
            </div>
            <div class="login-card">
                <h2>Welcome Back!</h2>
                <p class="login-subtitle">
                    Login to continue to your AI Chatbot
                </p>
                {% if error %}
                <div class="error-message">{{ error }}</div>
                {% endif %}
                <form method="POST" action="/login">
                    <div class="input-group">
                        <label for="email">
                            Email
                        </label>
                        <input type="email" id="email" name="email" placeholder="Enter your email"
                            value="{{ email or '' }}" required>
                    </div>
                    <div class="input-group">
                        <label for="password">
                            Password
                        </label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="login-button">
                        Login
                    </button>
                </form>
                <p class="signup-text">
                    Don't have an account?
                    <a href="/signup">
                        Create an account
                    </a>
                </p>
            </div>
        </main>
    </div>
</body>
</html>
